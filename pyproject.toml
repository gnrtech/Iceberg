[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-aggregator"
version = "0.1.0"
description = "API-first job aggregation from IT company career portals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.13.5",
]

[project.scripts]
job-aggregator = "job_aggregator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
